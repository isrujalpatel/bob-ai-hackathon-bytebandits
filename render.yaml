services:
  # ── Backend: FastAPI Service ──────────────────────────────────────────────
  - type: web
    name: container-congestion-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r src/backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --app-dir src --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://bob-ai-hackathon-bytebandits.vercel.app"

  # ── Frontend: React / Vite Static Site ────────────────────────────────────
  - type: web
    name: container-congestion-frontend
    env: static
    region: oregon
    plan: free
    rootDir: src/frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: container-congestion-backend
          property: host
