submission:
  title: "Container Congestion Predictor & Port Operations Optimiser" 

  problem_statement: >                 # REQUIRED
    Port operators at major container terminals like Los Angeles/Long Beach
    allocate berths and cranes manually using spreadsheets, only discovering
    congestion hotspots reactively after vessels have already begun queuing
    offshore — the 2021 LA/LB backlog held 100+ ships for weeks and cost
    supply chains over $10B. The core failure is that no tool connects
    real vessel-arrival volumes to proactive, shift-ready scheduling decisions.

  solution_summary: >                  # REQUIRED
    We built a full-stack system that fetches live daily vessel-call data from
    the IMF PortWatch API (real AIS-based satellite tracking), generates a
    calibrated 72-hour simulated vessel schedule, runs a rule-based congestion
    detector to flag over-capacity time windows before they occur, and applies
    a greedy berth/crane assignment optimiser to minimise total vessel wait time.
    The results feed a Google Gemini-powered natural-language operations brief
    that shift supervisors can act on immediately — no spreadsheet required.

  key_features:                        # REQUIRED
    - "Live IMF PortWatch API integration: real AIS-based daily vessel-call volumes anchor the 72-hour simulation"
    - "Rule-based congestion hotspot detection: slot-by-slot berth demand vs. capacity with LOW/MEDIUM/HIGH severity flags"
    - "Greedy berth & crane assignment optimiser: assigns each vessel to the earliest compatible berth, outputs structured schedule table"
    - "AI-generated 72-hour operations brief: Google Gemini 2.0 Flash produces a BLUF-style plan shift supervisors can act on immediately"
    - "React dashboard: interactive congestion timeline, filterable assignment table, and operations brief in one view"

  tech_stack:
    languages: ["Python", "JavaScript"]
    frameworks: ["FastAPI", "React", "Vite", "Recharts"]
    ibm_technologies: ["IBM Bob (AI coding agent — entire project built inside Bob IDE)"]
    databases: []
    other: ["IMF PortWatch API", "Google Gemini API", "httpx", "pandas", "Render", "Vercel"]

  what_we_are_most_proud_of: >
    The honest data-lineage design: instead of presenting fully synthetic data
    as if it were real, we anchor the simulation to live IMF PortWatch AIS data
    and clearly label the simulated layer. The congestion detector and berth
    optimiser are deliberately simple and explainable — a port supervisor can
    follow the logic, not just the output. And the entire project was built
    end-to-end inside IBM Bob, making the AI coding agent genuinely load-bearing,
    not just name-dropped.

  known_limitations: >
    Per-vessel ETAs and berth/crane counts are simulated (no free public dataset
    provides this granularity). The Gemini-generated brief requires a free API key;
    the app falls back to a structured rule-based brief if unavailable. The
    optimiser uses a greedy FCFS heuristic — not globally optimal, but O(V×B)
    and fully interpretable. Render free-tier backend cold-starts in ~30-60s
    after 15 min of inactivity.

